[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pinsecim"
version = "0.0.1"
description = "ESP32-C6 pin ataması pilotu: yerel model önerir, kod doğrulanmış tablolarla denetler."
requires-python = ">=3.11"
license = "MIT"
dependencies = ["asu_llmcore @ git+https://github.com/asunode/asu_llmcore@pilot-v1", "pdfplumber>=0.11",
                "psycopg[binary]>=3.1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["testler"]
